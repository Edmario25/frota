<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="hat" x1="20" y1="14" x2="44" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Fundo -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- Andaime — postes verticais -->
  <rect x="10" y="26" width="3.5" height="32" rx="1.75" fill="#475569" opacity="0.9"/>
  <rect x="50.5" y="26" width="3.5" height="32" rx="1.75" fill="#475569" opacity="0.9"/>

  <!-- Andaime — plataformas horizontais -->
  <rect x="10" y="42" width="44" height="3" rx="1.5" fill="#334155" opacity="0.9"/>
  <rect x="10" y="53" width="44" height="3" rx="1.5" fill="#334155" opacity="0.9"/>

  <!-- Andaime — travessa diagonal esquerda -->
  <line x1="13.5" y1="42" x2="13.5" y2="56" stroke="#334155" stroke-width="2" stroke-opacity="0.6"/>
  <line x1="54" y1="42" x2="54" y2="56" stroke="#334155" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Capacete — cúpula -->
  <path d="M16 30 C16 17 32 12 32 12 C32 12 48 17 48 30" fill="url(#hat)"/>

  <!-- Capacete — aba -->
  <rect x="12" y="28" width="40" height="6" rx="3" fill="#f59e0b"/>

  <!-- Capacete — friso interno -->
  <rect x="16" y="29.5" width="32" height="3" rx="1.5" fill="#fde68a" opacity="0.45"/>

  <!-- Capacete — brilho cúpula -->
  <ellipse cx="26" cy="20" rx="6" ry="4" fill="white" opacity="0.12" transform="rotate(-20 26 20)"/>
</svg>

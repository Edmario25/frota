<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0" y1="176" x2="0" y2="344" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)"/>

  <!-- Subtle grid lines (roads) -->
  <line x1="0" y1="420" x2="512" y2="420" stroke="#1e40af" stroke-width="3" opacity="0.4"/>
  <line x1="0" y1="440" x2="512" y2="440" stroke="#1e40af" stroke-width="1.5" opacity="0.2"/>

  <!-- ── TRUCK (side view) ────────────────────────────────── -->

  <!-- Cargo body -->
  <rect x="52" y="186" width="282" height="160" rx="14" fill="url(#bodyGrad)"/>

  <!-- Cargo door outline -->
  <rect x="52" y="186" width="282" height="160" rx="14" stroke="#94a3b8" stroke-width="3" fill="none"/>
  <line x1="193" y1="186" x2="193" y2="346" stroke="#94a3b8" stroke-width="2" opacity="0.6"/>

  <!-- Cab -->
  <path d="M334 234 L390 234 Q436 234 448 262 L464 320 L464 346 Q464 352 458 352 L334 352 Z" fill="url(#bodyGrad)"/>
  <path d="M334 234 L390 234 Q436 234 448 262 L464 320 L464 346 Q464 352 458 352 L334 352 Z" stroke="#94a3b8" stroke-width="3" fill="none"/>

  <!-- Cab windshield -->
  <path d="M342 244 L384 244 Q420 244 432 266 L444 306 L342 306 Z" fill="#93c5fd" opacity="0.85"/>
  <path d="M342 244 L384 244 Q420 244 432 266 L444 306 L342 306 Z" stroke="#60a5fa" stroke-width="2" fill="none" opacity="0.5"/>

  <!-- Windshield shine -->
  <path d="M352 252 L370 252 Q388 252 396 265 L400 282 L352 282 Z" fill="white" opacity="0.25"/>

  <!-- Side windows on cargo -->
  <rect x="70"  y="202" width="90" height="66" rx="8" fill="#93c5fd" opacity="0.25"/>
  <rect x="174" y="202" width="90" height="66" rx="8" fill="#93c5fd" opacity="0.25"/>

  <!-- Window frames -->
  <rect x="70"  y="202" width="90" height="66" rx="8" stroke="#60a5fa" stroke-width="2" fill="none" opacity="0.5"/>
  <rect x="174" y="202" width="90" height="66" rx="8" stroke="#60a5fa" stroke-width="2" fill="none" opacity="0.5"/>

  <!-- Headlight -->
  <rect x="460" y="316" width="14" height="28" rx="7" fill="#fde68a"/>
  <rect x="460" y="316" width="14" height="28" rx="7" fill="#fde68a" filter="url(#glow)" opacity="0.6"/>

  <!-- Tail light -->
  <rect x="50"  y="224" width="9"  height="36" rx="4.5" fill="#f87171"/>

  <!-- Truck connector / undercarriage -->
  <rect x="52" y="342" width="416" height="14" rx="7" fill="#475569" opacity="0.5"/>

  <!-- ── WHEELS ───────────────────────────────────────────── -->
  <!-- Rear wheel -->
  <circle cx="164" cy="370" r="56" fill="#0f172a"/>
  <circle cx="164" cy="370" r="42" fill="#1e293b"/>
  <circle cx="164" cy="370" r="28" fill="#334155"/>
  <!-- Spokes -->
  <line x1="164" y1="342" x2="164" y2="398" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
  <line x1="136" y1="354" x2="192" y2="386" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
  <line x1="136" y1="386" x2="192" y2="354" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
  <circle cx="164" cy="370" r="10" fill="#94a3b8"/>

  <!-- Front wheel -->
  <circle cx="398" cy="370" r="56" fill="#0f172a"/>
  <circle cx="398" cy="370" r="42" fill="#1e293b"/>
  <circle cx="398" cy="370" r="28" fill="#334155"/>
  <line x1="398" y1="342" x2="398" y2="398" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
  <line x1="370" y1="354" x2="426" y2="386" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
  <line x1="370" y1="386" x2="426" y2="354" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
  <circle cx="398" cy="370" r="10" fill="#94a3b8"/>

  <!-- ── GPS PIN (top-right) ────────────────────────────── -->
  <!-- Glow ring -->
  <circle cx="400" cy="104" r="40" fill="#3b82f6" opacity="0.12"/>
  <circle cx="400" cy="104" r="26" fill="#3b82f6" opacity="0.18"/>

  <!-- Pin shape -->
  <path d="M400 64 C380 64 364 80 364 100 C364 126 400 148 400 148 C400 148 436 126 436 100 C436 80 420 64 400 64 Z" fill="#3b82f6"/>
  <path d="M400 64 C380 64 364 80 364 100 C364 126 400 148 400 148 C400 148 436 126 436 100 C436 80 420 64 400 64 Z" stroke="#60a5fa" stroke-width="3" fill="none"/>

  <!-- Pin inner circle -->
  <circle cx="400" cy="98" r="14" fill="white"/>
  <circle cx="400" cy="98" r="7"  fill="#2563eb"/>

  <!-- Pin shine -->
  <circle cx="394" cy="91" r="4" fill="white" opacity="0.5"/>

  <!-- ── BRAND LABEL ─────────────────────────────────────── -->
  <text x="108" y="474" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="800" fill="white" letter-spacing="-1" opacity="0.9">FROTA</text>
  <text x="252" y="474" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="300" fill="#60a5fa" letter-spacing="2" opacity="0.8"> APP</text>
</svg>
